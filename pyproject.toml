[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Pipeline de ingestão, chunking, embeddings e indexação vetorial para RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.2.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.2.1",
    "langchain-pinecone>=0.2.13",
    "openai>=2.36.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client==1.10.1",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".agents"]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501", "I", "UP", "B", "SIM"]
