name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and Pytest
    runs-on: ubuntu-latest
    # SPEC-0044: teto do job (o padrão do GitHub é 360 minutos). Comporta o pior caso
    # do apt (15 minutos) e o restante da execução normal (cerca de 6 minutos).
    timeout-minutes: 25

    # O backend de aplicação (SPEC-0012) tem testes que falam com PostgreSQL de
    # verdade. `tests/conftest.py` aponta para localhost:55432/rag_pipeline_test —
    # o mesmo destino do `docker-compose.yml` usado localmente —, então a porta
    # publicada aqui é 55432, não 5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_pipeline_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:55432/rag_pipeline_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      # SPEC-0044: o espelho de pacotes do runner às vezes demora 15 a 30 minutos. O
      # script cancela cada tentativa em 300 segundos e tenta de novo, até 3 vezes
      # (pior caso: 15 minutos); o limite do passo é só uma folga de segurança.
      - name: Install system packages for document conversion
        timeout-minutes: 17
        run: bash .github/scripts/instalar_pacotes_apt.sh

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare local configuration
        run: |
          cp config.example.yaml config.yaml
          sed -i 's/collection_name: "base_exemplo"/collection_name: "ci-runner-collection"/' config.yaml
          sed -i 's/namespace: "base_exemplo"/namespace: "ci-runner-namespace"/' config.yaml

      # `tests/test_app_migrations.py` roda `alembic upgrade head` contra um banco
      # de scratch dedicado e não o cria; o serviço acima só cria rag_pipeline_test.
      - name: Create the Alembic scratch database
        run: |
          uv run python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:55432/postgres", autocommit=True
          ) as conexao:
              conexao.execute("CREATE DATABASE rag_pipeline_alembic_schema_check")
          PY

      # A fila do Procrastinate tem schema próprio, não criado por
      # `db.create_tables()`. `src.app.worker.app` é o alvo válido da CLI: já vem
      # com o PsycopgConnector real (src.app.tasks.app nasce em memória).
      - name: Apply the Procrastinate queue schema
        run: uv run python -m procrastinate --app src.app.worker.app schema --apply

      - name: Run Ruff
        run: uv run ruff check

      - name: Run Pytest
        run: uv run pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Vitest
        run: npm run test:tdd

      - name: Build
        run: npm run build
