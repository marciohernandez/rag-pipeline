name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare local configuration
        run: |
          cp config.example.yaml config.yaml
          sed -i 's/collection_name: "base_exemplo"/collection_name: "ci-runner-collection"/' config.yaml
          sed -i 's/namespace: "base_exemplo"/namespace: "ci-runner-namespace"/' config.yaml

      - name: Run Ruff
        run: uv run ruff check

      - name: Run Pytest
        run: uv run pytest
