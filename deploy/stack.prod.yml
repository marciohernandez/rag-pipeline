version: "3.7"

x-application-secrets: &application_secrets
  - openrouter_api_key
  - r2_credentials
  - conexoes_chave
  - postgres_password

services:
  backup_ragpipeline:
    image: rag-pipeline-backup:local
    environment:
      BACKUP_HORA: ${BACKUP_HORA:-03:00}
      BACKUP_TIMEOUT_SEGUNDOS: ${BACKUP_TIMEOUT_SEGUNDOS:-3600}
      BACKUP_MIN_BYTES: ${BACKUP_MIN_BYTES:-1024}
      BACKUP_TENTATIVAS: ${BACKUP_TENTATIVAS:-3}
    secrets:
      - backup_chave
      - backup_r2_credentials
      - backup_avisos
      - postgres_password
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == ${DATABASE_NODE_HOSTNAME}
    networks:
      - network_swarm_public

  backend_ragpipeline:
    image: rag-pipeline-backend:local
    command:
      - /bin/sh
      - -ec
      - |
        export OPENROUTER_API_KEY="$$(cat /run/secrets/openrouter_api_key)"
        export APP_CONEXOES_CHAVE_FILE=/run/secrets/conexoes_chave
        set -a
        . /run/secrets/r2_credentials
        set +a
        export APP_DATABASE_URL="$$(python -c 'from pathlib import Path; from urllib.parse import quote; password = quote(Path("/run/secrets/postgres_password").read_text().strip(), safe=""); print(f"postgresql+psycopg://rag_pipeline:{password}@postgres_ragpipeline:5432/rag_pipeline")')"
        exec .venv/bin/python -m uvicorn src.app.main:app --host 0.0.0.0 --port 8000
    environment: &application_environment
      APP_EMBEDDING_PROVIDER: ${APP_EMBEDDING_PROVIDER:-openrouter}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-openrouter}
      APP_VECTOR_STORE_COLLECTION: ${APP_VECTOR_STORE_COLLECTION:-rag-pipeline-app}
      APP_VECTOR_STORE_PROVIDER: qdrant
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      QDRANT_URL: http://qdrant_ragpipeline:6333
    secrets: *application_secrets
    deploy:
      placement:
        constraints:
          - node.hostname == ${APPLICATION_NODE_HOSTNAME}
    networks:
      - network_swarm_public

  frontend_ragpipeline:
    image: rag-pipeline-frontend:local
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend_ragpipeline:8000}
    deploy:
      labels:
        - "traefik.enable=true"
        - 'traefik.http.routers.ragpipeline-https.rule=Host(`${DOMINIO_RAGPIPELINE}`)'
        - "traefik.http.routers.ragpipeline-https.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
        - "traefik.http.routers.ragpipeline-https.tls=true"
        - "traefik.http.routers.ragpipeline-https.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}"
        - "traefik.http.routers.ragpipeline-https.priority=10"
        - "traefik.http.routers.ragpipeline-https.service=ragpipeline-frontend"
        - "traefik.http.routers.ragpipeline-https.middlewares=ragpipeline-hsts"
        - 'traefik.http.routers.ragpipeline-http.rule=Host(`${DOMINIO_RAGPIPELINE}`)'
        - "traefik.http.routers.ragpipeline-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}"
        - "traefik.http.routers.ragpipeline-http.service=ragpipeline-frontend"
        - "traefik.http.routers.ragpipeline-http.middlewares=ragpipeline-https-redirect"
        - "traefik.http.middlewares.ragpipeline-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.ragpipeline-https-redirect.redirectscheme.permanent=true"
        - "traefik.http.middlewares.ragpipeline-hsts.headers.stsseconds=${HSTS_MAX_AGE_SEGUNDOS:-86400}"
        - "traefik.http.middlewares.ragpipeline-hsts.headers.stsincludesubdomains=false"
        - "traefik.http.middlewares.ragpipeline-hsts.headers.stspreload=false"
        - 'traefik.http.routers.ragpipeline-login.rule=Host(`${DOMINIO_RAGPIPELINE}`) && Method(`POST`) && Path(`/api/v1/auth/login`)'
        - "traefik.http.routers.ragpipeline-login.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
        - "traefik.http.routers.ragpipeline-login.tls=true"
        - "traefik.http.routers.ragpipeline-login.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}"
        - "traefik.http.routers.ragpipeline-login.priority=100"
        - "traefik.http.routers.ragpipeline-login.service=ragpipeline-frontend"
        - "traefik.http.routers.ragpipeline-login.middlewares=ragpipeline-hsts,ragpipeline-login-limit"
        - "traefik.http.middlewares.ragpipeline-login-limit.ratelimit.average=${LOGIN_RATE_LIMIT_MEDIA:-10}"
        - "traefik.http.middlewares.ragpipeline-login-limit.ratelimit.period=1m"
        - "traefik.http.middlewares.ragpipeline-login-limit.ratelimit.burst=${LOGIN_RATE_LIMIT_RAJADA:-20}"
        - "traefik.http.middlewares.ragpipeline-login-limit.ratelimit.sourcecriterion.ipstrategy.depth=0"
        - "traefik.http.services.ragpipeline-frontend.loadbalancer.server.port=3000"
        - "traefik.http.services.ragpipeline-frontend.loadbalancer.passhostheader=true"
      placement:
        constraints:
          - node.hostname == ${APPLICATION_NODE_HOSTNAME}
    networks:
      - network_swarm_public

  worker_ragpipeline:
    image: rag-pipeline-backend:local
    command:
      - /bin/sh
      - -ec
      - |
        export OPENROUTER_API_KEY="$$(cat /run/secrets/openrouter_api_key)"
        export APP_CONEXOES_CHAVE_FILE=/run/secrets/conexoes_chave
        set -a
        . /run/secrets/r2_credentials
        set +a
        export APP_DATABASE_URL="$$(python -c 'from pathlib import Path; from urllib.parse import quote; password = quote(Path("/run/secrets/postgres_password").read_text().strip(), safe=""); print(f"postgresql+psycopg://rag_pipeline:{password}@postgres_ragpipeline:5432/rag_pipeline")')"
        exec .venv/bin/python -m src.app.worker
    environment: *application_environment
    secrets: *application_secrets
    deploy:
      placement:
        constraints:
          - node.hostname == ${APPLICATION_NODE_HOSTNAME}
    networks:
      - network_swarm_public

  postgres_ragpipeline:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag_pipeline
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: rag_pipeline
    secrets:
      - postgres_password
    volumes:
      - postgres_data_ragpipeline:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          - node.hostname == ${DATABASE_NODE_HOSTNAME}
    networks:
      - network_swarm_public

  qdrant_ragpipeline:
    image: qdrant/qdrant:v1.10.1
    volumes:
      - qdrant_data_ragpipeline:/qdrant/storage
    deploy:
      placement:
        constraints:
          - node.hostname == ${DATABASE_NODE_HOSTNAME}
    networks:
      - network_swarm_public

networks:
  network_swarm_public:
    external: true

volumes:
  postgres_data_ragpipeline:
    external: true
  qdrant_data_ragpipeline:
    external: true

# Cada secret é externo e versionado: `deploy/secrets.sh` cria `<nome>_v<N>` e
# `deploy/build_and_deploy.sh` exporta a versão mais alta em cada variável
# `*_SECRET` antes do `docker stack deploy` (SPEC-0027). O padrão `_v1` cobre a
# primeira instalação. O nome lógico (chave abaixo) é o arquivo em /run/secrets.
secrets:
  backup_chave:
    external: true
    name: ${BACKUP_CHAVE_SECRET:-backup_chave_v1}
  backup_r2_credentials:
    external: true
    name: ${BACKUP_R2_CREDENTIALS_SECRET:-backup_r2_credentials_v1}
  backup_avisos:
    external: true
    name: ${BACKUP_AVISOS_SECRET:-backup_avisos_v1}
  openrouter_api_key:
    external: true
    name: ${OPENROUTER_API_KEY_SECRET:-openrouter_api_key_v1}
  r2_credentials:
    external: true
    name: ${R2_CREDENTIALS_SECRET:-r2_credentials_v1}
  conexoes_chave:
    external: true
    name: ${CONEXOES_CHAVE_SECRET:-conexoes_chave_v1}
  postgres_password:
    external: true
    name: ${POSTGRES_PASSWORD_SECRET:-postgres_password_v1}
